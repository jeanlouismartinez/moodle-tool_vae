# Official continuous integration of Moodle (moodle-plugin-ci), on GitHub.
#
# Rewritten on 11 October 2026: the file announced in the CHANGELOG of 0.6.2 had never been committed.
# Branch MOODLE_503: one version of Moodle in the matrix, because version.php declares supported = [503, 503];
# the migration from the 4.5 package to the 5.3 package is no longer run here (decision of the project owner of
# 17 November 2026: it will not be used).
# Announcing a compatibility nobody tests would be worse than announcing none.
# Three databases: PostgreSQL and MariaDB since 11 October 2026, MySQL since 22 November 2026 (the plugins directory asks for
# MySQL and PostgreSQL at least). MariaDB and MySQL both listen on 3306 in their containers: MySQL is published on 3307 of the
# runner, and each database is installed on its own port (matrix key dbport).

name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

      # MySQL 8.4 is the lowest MySQL that Moodle 5.3 accepts (admin/environment.xml of Moodle 5.3).
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
        moodle-branch: ['MOODLE_503_STABLE']
        database: [pgsql, mariadb, mysqli]
        include:
          - database: pgsql
            dbport: 5432
          - database: mariadb
            dbport: 3306
          - database: mysqli
            dbport: 3307

    steps:
      - name: Check out the plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      # The privacy coverage and the language strings are PHPUnit tests (privacy_coverage_test, lang_strings_test).
      - name: Checks of the project (MC-2, MC-5, MC-30, secrets, English comments, references to docs)
        working-directory: plugin
        run: |
          bash scripts/check-core-writes.sh .
          bash scripts/check-gateway.sh .
          bash scripts/check-network-door.sh .
          bash scripts/test-check-network-door.sh
          bash scripts/check-secrets.sh
          node scripts/check-english-comments.mjs .
          node scripts/check-doc-links.mjs .

      - name: Rebuilt pivot schema (examples and counter-examples)
        working-directory: plugin
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/ajv" ajv@8.17.1 ajv-formats@3.0.1
          AJV_MODULES="$RUNNER_TEMP/ajv/node_modules" node scripts/check-schema.mjs .

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle and the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --db-port=${{ matrix.dbport }}
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP syntax
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle coding standard
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: PHPDoc
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Plugin validation
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache templates
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit
        if: ${{ !cancelled() }}
        env:
          TOOL_VAE_SCHEMA_DUMP: ${{ runner.temp }}/exported-evidence
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Evidence files exported by the tests, validated against the schema
        if: ${{ !cancelled() }}
        working-directory: plugin
        run: |
          AJV_MODULES="$RUNNER_TEMP/ajv/node_modules" node scripts/check-schema.mjs . --evidence "$RUNNER_TEMP/exported-evidence"

      - name: Behat (including the @javascript scenarios and axe-core)
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Screenshots when Behat fails
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore
